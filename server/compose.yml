services:
  eaglercraft:
    build: .
    container_name: eaglercraft-paper
    ports:
      - "25565:25565"
    volumes:
      - ./data:/server
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: eaglercraft-nginx
    ports:
      - "8081:8081"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - eaglercraft
    restart: unless-stopped
